# nginx in front of php-fpm (production). TLS is terminated here or at the load balancer.
server {
    listen 80;
    server_name vju.ac.vn www.vju.ac.vn;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64m;

    # Canonical host
    if ($host = www.vju.ac.vn) { return 301 https://vju.ac.vn$request_uri; }

    location = /health { access_log off; try_files $uri /index.php?$query_string; }

    # Built assets and media: long cache, served directly.
    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /storage/ { expires 30d; add_header Cache-Control "public"; try_files $uri /index.php?$query_string; }
    # Uploaded SVGs are sanitized; this header is the second layer if one is opened directly.
    location ~* ^/storage/.+\.svg$ { add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'none'"; add_header X-Content-Type-Options nosniff; expires 30d; }

    # Legacy WordPress upload URLs fall through to Laravel, which 301s them to the new media URLs.
    location /wp-content/ { try_files $uri /index.php?$query_string; }

    # Never serve dotfiles or PHP outside index.php.
    location ~ /\.(?!well-known) { deny all; }

    location / {
        # Keep the trailing slash: do not use "try_files $uri $uri/" redirects that strip it.
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
}
